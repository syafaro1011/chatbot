<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot JSON API</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="chat-container">
    <div class="chat-header">
      <div class="bot-avatar">🤖</div>
      <div>
        <h2>Chatbot Assistant</h2>
        <p>Online - Siap membantu Anda</p>
      </div>
    </div>

    <div id="chat-box" class="chat-box">
      <div class="message bot">
        <div class="message-avatar">🤖</div>
        <div class="message-content">
          Halo! Saya chatbot assistant. Ada yang bisa saya bantu?
        </div>
      </div>
    </div>

    <div class="chat-input-container">
      <input type="text" id="user-input" placeholder="Ketik pesan Anda di sini..." autocomplete="off"
        onkeypress="if(event.key === 'Enter') kirimPesan()">
      <button class="send-button" onclick="kirimPesan()">
        <span>➤</span>
      </button>
    </div>
  </div>

  <script>
    async function kirimPesan() {
      const input = document.getElementById("user-input");
      const chatBox = document.getElementById("chat-box");
      const pesan = input.value.trim();

      if (!pesan) return;

      // Tampilkan pesan user
      const userMessage = document.createElement('div');
      userMessage.className = 'message user';
      userMessage.innerHTML = `
        <div class="message-avatar">👤</div>
        <div class="message-content">${escapeHtml(pesan)}</div>
      `;
      chatBox.appendChild(userMessage);

      input.value = "";
      chatBox.scrollTop = chatBox.scrollHeight;

      // Tampilkan typing indicator
      const typingIndicator = document.createElement('div');
      typingIndicator.className = 'message bot';
      typingIndicator.innerHTML = `
        <div class="message-avatar">🤖</div>
        <div class="typing-indicator active">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `;
      chatBox.appendChild(typingIndicator);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: pesan })
        });

        const data = await res.json();

        // Hapus typing indicator
        typingIndicator.remove();

        // Tampilkan balasan bot
        const botMessage = document.createElement('div');
        botMessage.className = 'message bot';
        botMessage.innerHTML = `
          <div class="message-avatar">🤖</div>
          <div class="message-content">${escapeHtml(data.reply)}</div>
        `;
        chatBox.appendChild(botMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        typingIndicator.remove();

        const errorMessage = document.createElement('div');
        errorMessage.className = 'message bot';
        errorMessage.innerHTML = `
          <div class="message-avatar">⚠️</div>
          <div class="message-content">Maaf, terjadi kesalahan. Silakan coba lagi.</div>
        `;
        chatBox.appendChild(errorMessage);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>

</html>
