<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #fdc830 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #card {
            background: #fff;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            text-align: center;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 4em;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(-10px);
            }
        }

        h2 {
            color: #ff6b35;
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: #f7931e;
            font-size: 1.1em;
            margin-bottom: 30px;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 2px solid #fdc830;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 15px rgba(255, 107, 53, 0.3);
            transform: scale(1.02);
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(255, 107, 53, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #f7931e, #ff6b35);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 53, 0.5);
        }

        button:active {
            transform: translateY(-1px);
        }

        #error {
            display: none;
            background: linear-gradient(135deg, #dc143c, #ff4757);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-weight: 600;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            #card {
                padding: 40px 30px;
            }

            h2 {
                font-size: 1.6em;
            }

            .subtitle {
                font-size: 1em;
            }

            .icon {
                font-size: 3em;
            }

            input, button {
                padding: 12px 15px;
                font-size: 0.95em;
            }
        }

        @media (max-width: 360px) {
            #card {
                padding: 30px 20px;
            }

            h2 {
                font-size: 1.4em;
            }

            .icon {
                font-size: 2.5em;
            }
        }
    </style>
</head>
<body>

<div id="card">
    <div class="icon">🔐</div>
    <h2>Login Admin</h2>
    <p class="subtitle">Dashboard UMKM</p>

    <input type="password" id="pw" placeholder="Masukkan password admin">
    <button onclick="login()">Login</button>
    <div id="error">❌ Password salah!</div>
</div>

<script>
function login() {
    fetch("/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ password: document.getElementById("pw").value })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === "ok") {
            window.location.href = "/admin";
        } else {
            document.getElementById("error").style.display = "block";
            setTimeout(() => {
                document.getElementById("error").style.display = "none";
            }, 3000);
        }
    });
}

// Enter key listener
document.getElementById("pw").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        login();
    }
});
</script>

</body>
</html>
